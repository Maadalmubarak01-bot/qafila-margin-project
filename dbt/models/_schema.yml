version: 2
models:
  - name: product_cost_history
    description: "One row per SKU and changed cost; valid_to is exclusive."
    columns:
      - name: sku
        data_tests: [not_null]
      - name: valid_from
        data_tests: [not_null]
      - name: unit_cost_sar
        data_tests: [not_null]
      - name: is_current
        data_tests: [not_null]
  - name: weekly_margin
    description: "One row per ISO week, store city and product category."
    columns:
      - name: iso_week
        data_tests: [not_null]
      - name: city
        data_tests: [not_null]
      - name: category
        data_tests: [not_null]
  - name: price_quarantine
    description: "One row per rejected supplier input row."
    columns:
      - name: reason
        data_tests:
          - accepted_values:
              arguments:
                values: ['unknown_sku', 'invalid_cost']
